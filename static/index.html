<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FarmGPT - AI Advisor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="chat-header">
            <div class="header-content">
                <div class="avatar"><i class="fas fa-leaf"></i></div>
                <div class="info">
                    <h2>FarmGPT</h2>
                    <p>Online</p>
                </div>
            </div>

            <div class="lang-selector">
                <select id="langSelect">
                    <option value="Hindi">Hindi (हिंदी)</option>
                    <option value="Bengali">Bengali (বাংলা)</option>
                    <option value="Tamil">Tamil (தமிழ்)</option>
                    <option value="Telugu">Telugu (తెలుగు)</option>
                    <option value="Marathi">Marathi (मराठी)</option>
                    <option value="Gujarati">Gujarati (ગુજરાતી)</option>
                    <option value="Kannada">Kannada (ಕನ್ನಡ)</option>
                    <option value="Malayalam">Malayalam (മലയാളം)</option>
                    <option value="Punjabi">Punjabi (ਪੰਜਾਬੀ)</option>
                    <option value="Odia">Odia (ଓଡ଼ିଆ)</option>
                    <option value="English">English</option>
                </select>
            </div>
        </header>

        <!-- CHAT HISTORY -->
        <div class="chat-bg">
            <div id="chatBox" class="chat-box">
                <div class="encryption-notice">
                    <i class="fas fa-lock"></i> Messages are encrypted end-to-end. No one outside of this chat, not even
                    WhatsApp, can read or listen to them.
                </div>

                <div class="message received">
                    <span class="text">नमस्ते! 🌾<br>I am FarmGPT, your agricultural assistant. How can I help you
                        today? Ask me about crops, fertilizers, weather, or farming tips!</span>
                    <span class="time">Now</span>
                </div>
            </div>
        </div>

        <!-- INPUT BAR -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <i class="far fa-smile icon"></i>
                <input type="text" id="textInput" placeholder="Type a message">
                <i class="fas fa-location-arrow icon" id="locationBtn" title="Sync Location"
                    style="cursor:pointer; color:#008069;"></i>
            </div>

            <button class="voice-btn" id="voiceBtn">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="voice-btn send-btn" id="sendBtn" style="display: none;">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
