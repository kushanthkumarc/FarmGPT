<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS-Based Weather Integration</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,123,255,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,123,255,0.3);
        }

        .output {
            margin-top: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-family: monospace;
            font-size: 0.9em;
            word-wrap: break-word;
            min-height: 100px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Farm Location & Weather</h1>
        <button id="getLocationBtn">Get My Location</button>
        <div class="output" id="output">Waiting for actions...</div>
    </div>

    <script>
        const btn = document.getElementById("getLocationBtn");
        const output = document.getElementById("output");

        function logOutput(msg, data = null) {
            let str = `<b>${msg}</b><br>`;
            if (data) {
                str += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            output.innerHTML = str + output.innerHTML;
        }

        btn.addEventListener("click", () => {
            if (!("geolocation" in navigator)) {
                logOutput("Error: Geolocation is not supported by this browser.");
                return;
            }

            logOutput("Requesting GPS coordinates...");

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    logOutput(`Found Coordinates: lat=${lat.toFixed(4)}, lon=${lon.toFixed(4)}`);

                    // 1. Set location via POST
                    fetch('/set-location', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ lat, lon })
                    })
                    .then(res => res.json())
                    .then(data => {
                        logOutput("Location saved on server.", data);
                        
                        // 2. Fetch weather via GET relying on fallback context
                        logOutput("Fetching weather for saved location...");
                        return fetch('/weather');
                    })
                    .then(res => res.json())
                    .then(weatherData => {
                        logOutput("Weather Retrieved Successfully!", weatherData);
                    })
                    .catch(err => {
                        logOutput(`Error: ${err.message}`);
                    });
                },
                function(error) {
                    logOutput(`GPS Error: ${error.message} (Code: ${error.code})`);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });
    </script>
</body>
</html>
